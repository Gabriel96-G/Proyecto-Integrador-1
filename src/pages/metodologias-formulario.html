<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="registrarMetodologiaDeAprendizaje">Registrar metodología de aprendizaje</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/plantilla-bootstrap.js" defer></script>
    <script src="../js/traducciones.js" defer=""></script>
    <script src="../js/idioma.js" defer=""></script>
    <script src="../js/mensaje-exito.js" defer=""></script>
    <script src="../js/metodologias.js" defer=""></script>
    <script src="../js/sesion.js" defer=""></script>
</head>

<body class="con-bootstrap">
    <div class="aplicacion">

        <!-- Cabecera institucional Bootstrap -->
        <header class="navbar navbar-expand-md cabecera" data-raiz="../"></header>

        <!-- Menú de navegación Bootstrap -->
        <nav class="navbar-expand-md navegacion" aria-label="Menú principal" data-i18n-aria-label="menuPrincipal"
            data-seccion="catalogos"></nav>

        <!-- Contenido del formulario -->
        <main class="contenido">

            <p class="ruta" id="ruta-metodologia" data-i18n="catalogosMetodologiasDeAprendizajeNuevoRegistro">
                Catálogos / Metodologías de aprendizaje / Nuevo registro
            </p>

            <h1 id="titulo-metodologia" data-i18n="registrarMetodologiaDeAprendizaje">Registrar metodología de
                aprendizaje</h1>

            <section class="catalogo-formulario">

                <!-- Tarjeta informativa -->
                <div class="catalogo-formulario__ficha">
                    <img class="catalogo-resumen__icono" src="../img/catalogos.svg" alt="">

                    <h2 data-i18n="metodologiaDeAprendizaje">Metodología de aprendizaje</h2>

                    <p data-i18n="codigoNombreYDescripcionDeLaMetodologia">
                        Código, nombre y descripción
                        de la metodología.
                    </p>
                </div>

                <!-- Formulario HU-38 -->
                <form id="formulario-metodologia" class="container-fluid formulario formulario__seccion" novalidate="">

                    <div class="row gx-4 gy-3">

                        <!-- Código -->
                        <div class="col-12 col-md-4 formulario__campo">

                            <label for="codigo" class="form-label formulario__etiqueta">
                                <span data-i18n="codigo">Código</span>
                                <span class="formulario__obligatorio">*</span>
                            </label>


                            <input type="number" id="codigo" name="codigo" class="form-control formulario__control"
                                step="1" required="" aria-describedby="error-codigo">

                            <p id="error-codigo" class="formulario__mensaje" aria-live="polite"></p>
                        </div>

                        <!-- Nombre -->
                        <div class="col-12 col-md-8 formulario__campo">
                            <label for="nombre" class="form-label formulario__etiqueta"> <span
                                    data-i18n="nombreEtiqueta">Nombre</span> <span
                                    class="formulario__obligatorio">*</span>
                            </label>

                            <input type="text" id="nombre" name="nombre" class="form-control formulario__control"
                                required="" aria-describedby="error-nombre">

                            <p id="error-nombre" class="formulario__mensaje" aria-live="polite"></p>
                        </div>

                        <!-- Descripción -->
                        <div class="col-12 formulario__campo">
                            <label for="descripcion" class="form-label formulario__etiqueta"> <span
                                    data-i18n="descripcion">Descripción</span> <span
                                    class="formulario__obligatorio">*</span>
                            </label>

                            <textarea id="descripcion" name="descripcion" class="form-control formulario__control"
                                rows="5" required="" aria-describedby="error-descripcion"></textarea>

                            <p id="error-descripcion" class="formulario__mensaje" aria-live="polite"></p>
                        </div>

                    </div>

                    <p class="formulario__nota" data-i18n="campoObligatorio">
                        * Campo obligatorio
                    </p>

                    <p id="mensaje-resultado" class="alert aviso" role="status" aria-live="polite" hidden=""></p>

                    <div class="formulario__acciones">
                        <button type="submit" id="boton-guardar-metodologia" class="btn btn-primary boton boton--principal"
                            data-i18n="guardarMetodologia">
                            Guardar metodología
                        </button>

                        <a href="metodologias-listado.html" class="btn btn-outline-secondary boton boton--secundario" data-i18n="cancelar">
                            Cancelar
                        </a>
                    </div>

                </form>
            </section>
        </main>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"
        defer></script>


</body>

</html>
