<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metodologías de aprendizaje | SGC</title>

    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/interfaz.js" defer></script>
    <script src="../js/metodologias-listado.js" defer></script>
    <script src="../js/sesion.js" defer></script>
</head>

<body class="pagina-aylin">

    <a class="salto-contenido" href="#contenido">
        Saltar al contenido
    </a>

    <div class="aplicacion">

        <!-- Cabecera institucional -->
        <header class="cabecera">
            <a class="cabecera__marca" href="inicio.html">
              
<img class="cabecera__logo"
     src="../img/logo-cenfotec.png"
     alt="Universidad CENFOTEC">
            </a>

            <span class="cabecera__nombre">
                Gestión curricular
            </span>

            <span class="cabecera__usuario">
                <img class="icono-usuario" src="../img/usuario.svg" alt="">
                Administrador
            </span>
        </header>

        <!-- Menú lateral -->
        <nav class="navegacion" aria-label="Menú principal">

            <details class="navegacion__desplegable" open>
                <summary class="navegacion__alternar">
                    Menú
                </summary>

                <ul class="navegacion__lista">

                    <li class="navegacion__item">
                        <a class="navegacion__enlace" href="inicio.html">
                            <img class="icono-menu" src="../img/inicio.svg" alt="">
                            Inicio
                        </a>
                    </li>

                    <li class="navegacion__item">
                        <a class="navegacion__enlace" href="usuarios.html">
                            <img class="icono-menu" src="../img/usuarios.svg" alt="">
                            Usuarios
                        </a>
                    </li>

                    <li class="navegacion__item">
                        <a class="navegacion__enlace" href="catalogos.html" aria-current="page">
                            <img class="icono-menu" src="../img/catalogos.svg" alt="">
                            Catálogos
                        </a>
                    </li>

                    <li class="navegacion__item">
                        <a class="navegacion__enlace" href="cursos.html">
                            <img class="icono-menu" src="../img/cursos.svg" alt="">
                            Cursos
                        </a>
                    </li>

                </ul>
            </details>

            <a class="navegacion__salir" href="login.html">
                <img class="icono-menu" src="../img/cerrar.svg" alt="">
                Cerrar sesión
            </a>
        </nav>

        <!-- Contenido principal -->
        <main class="contenido" id="contenido">

            <p class="ruta">
                Catálogos / Metodologías de aprendizaje
            </p>

            <!-- Encabezado según wireframe -->
            <section class="catalogo__cabecera">

                <img class="icono" src="../img/catalogos.svg" alt="">

                <div>
                    <h1>Metodologías de aprendizaje</h1>
                    <p>Catálogo institucional</p>
                </div>

                <a class="boton boton--principal" href="metodologias-formulario.html">
                    Registrar nueva metodología
                </a>

            </section>

            <!-- HU-39: Listado de metodologías -->
            <section class="listado" aria-label="Metodologías de aprendizaje registradas">

                <!-- HU-40: Búsqueda sencilla -->
                <div class="listado__herramientas">

                    <div class="busqueda">

                        <label class="busqueda__etiqueta" for="buscar-metodologias">
                            Buscar por código o nombre
                        </label>

                        <input class="busqueda__control" id="buscar-metodologias" name="busqueda" type="search"
                            placeholder="Buscar metodología..." autocomplete="off">

                    </div>

                </div>

                <!-- Tabla de registros -->
                <div class="tabla-contenedor" role="region" aria-label="Listado con desplazamiento horizontal"
                    tabindex="0">

                    <table id="tabla-metodologias" class="tabla tabla--catalogo">

                        <thead>
                            <tr>
                                <th scope="col">Código</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Descripción</th>
                                <th scope="col">Acción</th>
                            </tr>
                        </thead>

                        <tbody id="cuerpo-tabla-metodologias">
                            <!-- Registros cargados mediante JavaScript -->
                        </tbody>

                    </table>

                    <p id="mensaje-listado" class="estado-vacio" role="status" aria-live="polite">
                    </p>

                </div>

            </section>

        </main>

    </div>

</body>

</html>
