<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/almacenamiento-aylin.js" defer></script>
    <script src="../js/login.js" defer></script>
</head>
<body>
    <header class="cabecera">
        <a class="cabecera__marca" href="../index.html">
            <img class="cabecera__logo" src="../img/logo-cenfotec.png" alt="Universidad CENFOTEC">
        </a>
        <span class="cabecera__nombre">Gestión curricular</span>
        <span class="cabecera__institucion">Universidad CENFOTEC</span>
    </header>

    <main class="contenedor">
        <div class="acceso">
            <section class="acceso__identidad">
                <div>
                    <h1>Bienvenido de nuevo</h1>
                    <p>Un mismo espacio para la gestión de usuarios, catálogos y cursos.</p>
                </div>
                <div class="acceso__beneficios">
                    <div class="acceso__beneficio">
                        <img class="icono" src="../assets/icons/catalogos.svg" alt="">
                        <span>Organizar</span>
                    </div>
                    <div class="acceso__beneficio">
                        <img class="icono" src="../assets/icons/cursos.svg" alt="">
                        <span>Consultar</span>
                    </div>
                    <div class="acceso__beneficio">
                        <img class="icono" src="../assets/icons/escuela.svg" alt="">
                        <span>Completar</span>
                    </div>
                </div>
            </section>

            <section class="acceso__contenido" aria-labelledby="titulo-login">
                <div>
                    <h2 id="titulo-login">Iniciar sesión</h2>
                    <p class="acceso__subtitulo">Acceso de administrador</p>
                </div>

                <form id="formulario-login" class="formulario" novalidate>
                    <div class="formulario__campo">
                        <label class="formulario__etiqueta" for="correo">Correo institucional *</label>
                        <input class="formulario__control" id="correo" name="correo" type="email"
                               autocomplete="username" aria-describedby="correo-mensaje" required>
                        <p id="correo-mensaje" class="formulario__mensaje" aria-live="polite"></p>
                    </div>

                    <div class="formulario__campo">
                        <label class="formulario__etiqueta" for="contrasena">Contraseña *</label>
                        <input class="formulario__control" id="contrasena" name="contrasena" type="password"
                               autocomplete="current-password" aria-describedby="contrasena-mensaje" required>
                        <p id="contrasena-mensaje" class="formulario__mensaje" aria-live="polite"></p>
                    </div>

                    <p id="mensaje-login" class="aviso aviso--error" role="alert" hidden></p>
                    <button class="boton boton--principal boton--completo" type="submit">Ingresar</button>
                </form>

                <span class="acceso__enlaces" aria-disabled="true" title="Función aún no disponible">
                    ¿Olvidó su contraseña?
                </span>
            </section>
        </div>
    </main>
</body>
</html>
