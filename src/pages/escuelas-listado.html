<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de escuelas</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/escuelas-listado.js" defer></script>
</head>

<body>
    <div class="aplicacion">

        <header class="cabecera">
            <a class="cabecera__marca" href="inicio.html">
                <img class="cabecera__logo" src="../img/logo-cenfotec.png" alt="Universidad CENFOTEC">
            </a>

            <span class="cabecera__nombre">Gestión curricular</span>

            <span class="cabecera__usuario">
                <img class="icono-usuario" src="../assets/icons/usuario.svg" alt="">
                Administrador
            </span>
        </header>

        <nav class="navegacion" aria-label="Menú principal">
            <ul class="navegacion__lista">
                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="inicio.html">
                        <img class="icono-menu" src="../assets/icons/inicio.svg" alt="">
                        Inicio
                    </a>
                </li>

                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="usuarios.html">
                        <img class="icono-menu" src="../assets/icons/usuarios.svg" alt="">
                        Usuarios
                    </a>
                </li>

                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="catalogos.html" aria-current="page">
                        <img class="icono-menu" src="../assets/icons/catalogos.svg" alt="">
                        Catálogos
                    </a>
                </li>

                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="cursos.html">
                        <img class="icono-menu" src="../assets/icons/cursos.svg" alt="">
                        Cursos
                    </a>
                </li>
            </ul>

            <a class="navegacion__salir" href="../index.html">
                <img class="icono-menu" src="../assets/icons/cerrar.svg" alt="">
                Cerrar sesión
            </a>
        </nav>

        <main class="contenido">
            <p class="ruta">Catálogos / Escuelas</p>

            <section class="catalogo__cabecera">
                <img class="icono" src="../assets/icons/escuela.svg" alt="">

                <div>
                    <h1>Escuelas</h1>
                    <p>Organización institucional</p>
                </div>

                <a class="boton boton--principal" href="escuelas-formulario.html">
                    Registrar escuela
                </a>
            </section>

            <section class="listado" aria-labelledby="titulo-listado">
                <h2 id="titulo-listado">Escuelas registradas</h2>

                <div class="listado__herramientas">
                    <div class="busqueda">
                        <label class="busqueda__etiqueta" for="buscar-escuela">
                            Buscar por nombre
                        </label>
                        <input class="busqueda__control" id="buscar-escuela" type="search"
                               placeholder="Buscar escuela...">
                    </div>
                </div>

                <div class="tabla-contenedor">
                    <table id="tabla-escuelas" class="tabla tabla--catalogo" hidden>
                        <thead>
                            <tr>
                                <th scope="col">Código</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Director</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-escuelas"></tbody>
                    </table>

                    <p id="mensaje-listado" class="estado-vacio" role="status" hidden>
                        No existen escuelas registradas.
                    </p>
                </div>

                <a class="enlace-accion" href="catalogos.html">
                    ‹ Volver a catálogos
                </a>
            </section>
        </main>
    </div>
</body>
</html>
