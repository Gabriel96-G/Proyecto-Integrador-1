<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="registrarCarreraSgc">Registrar carrera | SGC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/plantilla-bootstrap.js" defer></script>
    <script src="../js/traducciones.js" defer></script>
    <script src="../js/idioma.js" defer></script>
    <script src="../js/almacenamiento.js" defer></script>
    <script src="../js/carreras-validacion.js" defer></script>
    <script src="../js/carreras-datos.js" defer></script>
    <script src="../js/interfaz.js" defer></script>
    <script src="../js/mensaje-exito.js" defer></script>
    <script src="../js/carreras-formulario.js" defer></script>
    <script src="../js/sesion.js" defer></script>
</head>

<body class="con-bootstrap">
    <a class="salto-contenido" href="#contenido" data-i18n="saltarAlContenido">Saltar al contenido</a>
    <div class="aplicacion">

        <header class="navbar navbar-expand-md cabecera" data-raiz="../"></header>

        <nav class="navbar-expand-md navegacion" aria-label="Menú principal" data-i18n-aria-label="menuPrincipal" data-seccion="catalogos"></nav>

        <main class="contenido" id="contenido">
            <header class="pagina__encabezado">
                <h1 id="titulo" data-i18n="registrarCarrera">Registrar carrera</h1>
                <p class="ruta" id="ruta" data-i18n="catalogosCarrerasNuevoRegistro">Catálogos / Carreras / Nuevo registro</p>
            </header>

            <div class="catalogo-formulario">
                <aside class="catalogo-formulario__ficha">
                    <img class="catalogo-resumen__icono" src="../img/cursos.svg" alt="">
                    <h2 data-i18n="carreras">Carreras</h2>
                    <p data-i18n="codigoNombreYEscuelaAsociada">Código, nombre y escuela asociada.</p>
                </aside>

                <form class="container-fluid formulario formulario__seccion" id="catalogo-form" novalidate>
                    <div class="row gx-4 gy-3">
                        <div class="col-12 col-md-4 formulario__campo">
                            <label class="form-label formulario__etiqueta" for="codigo" data-i18n="codigoObligatorio">Código *</label>
                            <input class="form-control formulario__control" id="codigo" name="codigo" type="text" maxlength="40" aria-describedby="codigo-mensaje" required>
                            <p class="formulario__mensaje" id="codigo-mensaje" data-error-for="codigo" aria-live="polite"></p>
                        </div>
                        <div class="col-12 col-md-8 formulario__campo">
                            <label class="form-label formulario__etiqueta" for="nombre" data-i18n="nombre">Nombre *</label>
                            <input class="form-control formulario__control" id="nombre" name="nombre" type="text" maxlength="150" aria-describedby="nombre-mensaje" required>
                            <p class="formulario__mensaje" id="nombre-mensaje" data-error-for="nombre" aria-live="polite"></p>
                        </div>
                        <div class="col-12 formulario__campo">
                            <label class="form-label formulario__etiqueta" for="escuela" data-i18n="escuelaAsociada">Escuela asociada *</label>
                            <select class="form-select formulario__control" id="escuela" name="escuela" aria-describedby="escuela-mensaje" required>
                                <option value="" data-i18n="seleccioneUnaEscuela">Seleccione una escuela</option>
                            </select>
                            <p class="formulario__mensaje" id="escuela-mensaje" data-error-for="escuela" aria-live="polite"></p>
                        </div>
                    </div>

                    <p class="formulario__nota" data-i18n="campoObligatorio">* Campo obligatorio</p>

                    <div class="formulario__acciones">
                        <button class="btn btn-primary boton boton--principal" id="guardar" type="submit" data-i18n="guardarRegistro">Guardar registro</button>
                        <a class="btn btn-outline-secondary boton boton--secundario" href="carreras-listado.html" data-i18n="cancelar">Cancelar</a>
                    </div>
                </form>
            </div>

            <a class="enlace-accion" href="carreras-listado.html" data-i18n="volverACarreras">‹ Volver a carreras</a>
            <p class="alert aviso" id="aviso" hidden></p>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous" defer></script>
</body>
</html>
