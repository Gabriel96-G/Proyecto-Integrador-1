<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="carrerasSgc">Carreras | SGC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/plantilla-bootstrap.js" defer></script>
    <script src="../js/traducciones.js" defer></script>
    <script src="../js/idioma.js" defer></script>
    <script src="../js/almacenamiento.js" defer></script>
    <script src="../js/carreras-validacion.js" defer></script>
    <script src="../js/carreras-datos.js" defer></script>
    <script src="../js/interfaz.js" defer></script>
    <script src="../js/carreras-listado.js" defer></script>
    <script src="../js/sesion.js" defer></script>
</head>

<body class="con-bootstrap">
    <a class="salto-contenido" href="#contenido" data-i18n="saltarAlContenido">Saltar al contenido</a>
    <div class="aplicacion">

        <header class="navbar navbar-expand-md cabecera" data-raiz="../"></header>

        <nav class="navbar-expand-md navegacion" aria-label="Menú principal" data-i18n-aria-label="menuPrincipal" data-seccion="catalogos"></nav>

        <main class="contenido" id="contenido">
            <p class="ruta" data-i18n="catalogosCarreras">Catálogos / Carreras</p>

            <section class="catalogo__cabecera">
                <img class="icono" src="../img/cursos.svg" alt="">
                <div>
                    <h1 data-i18n="carreras">Carreras</h1>
                    <p data-i18n="organizacionInstitucional">Organización institucional</p>
                </div>
                <a class="btn btn-primary boton boton--principal" href="carreras-formulario.html" data-i18n="registrarCarrera">Registrar carrera</a>
            </section>

            <section class="listado" aria-label="Carreras registradas" data-i18n-aria-label="carrerasRegistradas">
                <div class="listado__herramientas">
                    <div class="busqueda">
                        <label class="form-label busqueda__etiqueta" for="buscar" data-i18n="buscarPorCodigoONombre">Buscar por código o nombre</label>
                        <input class="form-control busqueda__control" id="buscar" name="busqueda" type="search" placeholder="Buscar carrera..." autocomplete="off" data-i18n-placeholder="buscarCarrera">
                    </div>
                </div>

                <p class="formulario__ayuda" id="cantidad" role="status"></p>

                <div class="table-responsive tabla-contenedor">
                    <table class="table tabla tabla--catalogo">
                        <thead>
                            <tr>
                                <th scope="col" data-i18n="codigo">Código</th>
                                <th scope="col" data-i18n="nombreEtiqueta">Nombre</th>
                                <th scope="col" data-i18n="escuelaAsociadaEtiqueta">Escuela asociada</th>
                                <th scope="col" data-i18n="accion">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="registros"></tbody>
                    </table>
                    <p class="alert estado-vacio" id="vacio" hidden></p>
                </div>
            </section>

            <p class="alert aviso" id="aviso" hidden></p>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous" defer></script>
</body>
</html>
