<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="listadoDeCasasCertificadorasCenfotec">Listado de casas certificadoras - CENFOTEC</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/plantilla-bootstrap.js" defer></script>
    <script src="../js/traducciones.js" defer=""></script>
    <script src="../js/idioma.js" defer=""></script>
    <script src="../js/casas-certificadoras-listado.js" defer=""></script>

    <script src="../js/sesion.js" defer=""></script>
</head>

<body class="con-bootstrap">
    <a class="salto-contenido" href="#contenido" data-i18n="saltarAlContenido">Saltar al contenido</a>
    <div class="aplicacion">

        <!-- Cabecera institucional Bootstrap -->
        <header class="navbar navbar-expand-md cabecera" data-raiz="../"></header>

        <!-- Menú institucional Bootstrap -->
        <nav class="navbar-expand-md navegacion" aria-label="Menú principal" data-i18n-aria-label="menuPrincipal"
            data-seccion="catalogos"></nav>


        <main class="contenido" id="contenido">
            <p class="ruta" data-i18n="catalogosCasasCertificadoras">Catálogos / Casas certificadoras</p>
            <section class="catalogo__cabecera">
                <img class="icono" src="../img/catalogos.svg" alt="">
                <div>
                    <h1 data-i18n="casasCertificadoras">Casas certificadoras</h1>
                    <p data-i18n="organizacionesCertificadoras">Organizaciones certificadoras</p>
                </div>

                <a class="btn btn-primary boton boton--principal" href="casas-certificadoras-formulario.html"
                    data-i18n="registrarCasaCertificadora">Registrar casa certificadora</a>

            </section>
            <section class="listado" aria-labelledby="titulo-listado">
                <h2 id="titulo-listado" data-i18n="casasCertificadorasRegistradas">Casas certificadoras registradas</h2>
                <div class="listado__herramientas">
                    <div class="busqueda">
                        <label class="form-label busqueda__etiqueta" for="buscar-casas-certificadoras"
                            data-i18n="buscarPorCodigoONombre">Buscar por código o nombre</label>
                        <input class="form-control busqueda__control" id="buscar-casas-certificadoras" name="busqueda"
                            type="search" placeholder="Buscar casa certificadora..." autocomplete="off"
                            aria-controls="tabla-casas-certificadoras" data-i18n-placeholder="buscarCasaCertificadora">
                    </div>
                </div>

                <div class="table-responsive tabla-contenedor" role="region"
                    aria-label="Listado con desplazamiento horizontal" tabindex="0"
                    data-i18n-aria-label="listadoConDesplazamientoHorizontal">
                    <table id="tabla-casas-certificadoras" class="table table-striped table-hover tabla tabla--catalogo" hidden>
                        <thead>
                            <tr>
                                <th scope="col" data-i18n="codigo">Código</th>
                                <th scope="col" data-i18n="nombreEtiqueta">Nombre</th>
                                <th scope="col" data-i18n="accion">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-casas"></tbody>
                    </table>
                    <p class="estado-vacio" id="mensaje-listado" role="status" hidden></p>
                </div>
            </section>


        </main>
    </div>

    <!-- Bootstrap 5.3.9 JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"
        defer></script>

</body>

</html>
