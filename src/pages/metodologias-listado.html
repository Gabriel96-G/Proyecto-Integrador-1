<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Listado de Metodologías - CENFOTEC</title>

    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <header class="cabecera">
        <div class="contenedor">
            <span class="cabecera__nombre">
                Sistema de Gestión de Cursos
            </span>
        </div>
    </header>

    <main class="contenedor">

        <h1>Listado de metodologías de aprendizaje</h1>

        <p>
            Consulte las metodologías de aprendizaje
            registradas en el sistema.
        </p>

        <section class="formulario__seccion">

            <h2 class="formulario__titulo">
                Metodologías registradas
            </h2>

            <!-- HU-40: Búsqueda y filtrado de metodologías -->
            <form id="formulario-filtros-metodologias" class="formulario" role="search">

                <div class="formulario__rejilla">

                    <!-- Búsqueda general -->
                    <div class="formulario__campo formulario__campo--completo">

                        <label for="buscar-metodologias" class="formulario__etiqueta">
                            Buscar por código o nombre
                        </label>

                        <input type="search" id="buscar-metodologias" name="busqueda" class="formulario__control"
                            placeholder="Ingrese un código o nombre">

                    </div>

                    <!-- Filtro por código -->
                    <div class="formulario__campo">

                        <label for="filtro-codigo" class="formulario__etiqueta">
                            Filtrar por código
                        </label>

                        <input type="text" id="filtro-codigo" name="filtroCodigo" class="formulario__control"
                            placeholder="Código">

                    </div>

                    <!-- Filtro por nombre -->
                    <div class="formulario__campo">

                        <label for="filtro-nombre" class="formulario__etiqueta">
                            Filtrar por nombre
                        </label>

                        <input type="text" id="filtro-nombre" name="filtroNombre" class="formulario__control"
                            placeholder="Nombre">

                    </div>

                    <!-- Filtro por descripción -->
                    <div class="formulario__campo formulario__campo--completo">

                        <label for="filtro-descripcion" class="formulario__etiqueta">
                            Filtrar por descripción
                        </label>

                        <input type="text" id="filtro-descripcion" name="filtroDescripcion" class="formulario__control"
                            placeholder="Descripción">

                    </div>

                </div>

                <div class="formulario__acciones">

                    <button type="submit" class="boton boton--principal">
                        Buscar y filtrar
                    </button>

                    <button type="reset" class="boton boton--secundario">
                        Limpiar filtros
                    </button>

                </div>

            </form>


            <!-- Tabla de metodologías -->
            <table id="tabla-metodologias" class="tabla">

                <thead>
                    <tr>
                        <th scope="col">Código</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Descripción</th>
                    </tr>
                </thead>

                <tbody id="cuerpo-tabla-metodologias">

                    <!-- Los registros se agregarán
                         dinámicamente con JavaScript -->

                </tbody>

            </table>

            <!-- Mensaje cuando no existen registros -->
            <p id="mensaje-listado" class="formulario__mensaje" role="status" aria-live="polite">
                El listado se cargará al conectar JavaScript.
            </p>

            <!-- Acciones -->
            <div class="formulario__acciones">

                <a href="metodologias-formulario.html" class="boton boton--principal">
                    Registrar nueva metodología
                </a>

            </div>

        </section>

    </main>

    <script src="../js/metodologias-listado.js"></script>

</body>

</html>
