<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="listadoDeEscuelas">Listado de escuelas</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/traducciones.js" defer=""></script>
    <script src="../js/idioma.js" defer=""></script>
    <script src="../js/escuelas-listado.js" defer=""></script>
    <script src="../js/sesion.js" defer=""></script>
<link rel="stylesheet" href="../css/idioma.css"></head>

<body>
    <div class="aplicacion">

        <header class="cabecera">
            <a class="cabecera__marca" href="inicio.html">
                <img class="cabecera__logo" src="../img/logo-cenfotec.png" alt="Universidad CENFOTEC">
            </a>

            <span class="cabecera__nombre" data-i18n="gestionCurricular">Gestión curricular</span>

        <form id="formulario-idioma" class="selector-idioma">
    <label for="idioma" data-i18n="idioma">Idioma</label>
    <select id="idioma" name="idioma">
        <option value="es" lang="es">Español</option>
        <option value="en" lang="en">English</option>
    </select>
    <button type="submit" data-i18n="aplicarIdioma">Aplicar</button>
    <span class="selector-idioma__estado" id="estado-idioma" role="status" aria-live="polite"></span>
</form></header>

        <nav class="navegacion" aria-label="Menú principal" data-i18n-aria-label="menuPrincipal">
            <ul class="navegacion__lista">
                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="inicio.html">
                        <img class="icono-menu" src="../img/inicio.svg" alt=""> <span data-i18n="inicio">Inicio</span> </a>
                </li>

                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="usuarios.html">
                        <img class="icono-menu" src="../img/usuarios.svg" alt=""> <span data-i18n="usuarios">Usuarios</span> </a>
                </li>

                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="catalogos.html" aria-current="page">
                        <img class="icono-menu" src="../img/catalogos.svg" alt=""> <span data-i18n="catalogos">Catálogos</span> </a>
                </li>

                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="cursos.html">
                        <img class="icono-menu" src="../img/cursos.svg" alt=""> <span data-i18n="cursos">Cursos</span> </a>
                </li>
            </ul>

            <a class="navegacion__salir" href="login.html">
                <img class="icono-menu" src="../img/cerrar.svg" alt=""> <span data-i18n="cerrarSesion">Cerrar sesión</span> </a>
        </nav>

        <main class="contenido">
            <p class="ruta" data-i18n="catalogosEscuelas">Catálogos / Escuelas</p>

            <section class="catalogo__cabecera">
                <img class="icono" src="../img/escuela.svg" alt="">

                <div>
                    <h1 data-i18n="escuelas">Escuelas</h1>
                    <p data-i18n="organizacionInstitucional">Organización institucional</p>
                </div>

                <a class="boton boton--principal" href="escuelas-formulario.html" data-i18n="registrarEscuela">
                    Registrar escuela
                </a>
            </section>

            <section class="listado" aria-labelledby="titulo-listado">
                <h2 id="titulo-listado" data-i18n="escuelasRegistradas">Escuelas registradas</h2>

                <div class="listado__herramientas">
                    <div class="busqueda">
                        <label class="busqueda__etiqueta" for="buscar-escuela" data-i18n="buscarPorNombre">
                            Buscar por nombre
                        </label>
                        <input class="busqueda__control" id="buscar-escuela" type="search" placeholder="Buscar escuela..." data-i18n-placeholder="buscarEscuela">
                    </div>
                </div>

                <div class="tabla-contenedor">
                    <table id="tabla-escuelas" class="tabla tabla--catalogo" hidden="">
                        <thead>
                            <tr>
                                <th scope="col" data-i18n="codigo">Código</th>
                                <th scope="col" data-i18n="nombreEtiqueta">Nombre</th>
                                <th scope="col" data-i18n="director">Director</th>
                                <th scope="col" data-i18n="accion">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-escuelas"></tbody>
                    </table>

                    <p id="mensaje-listado" class="estado-vacio" role="status" hidden="" data-i18n="noExistenEscuelasRegistradas">
                        No existen escuelas registradas.
                    </p>
                </div>

            </section>
        </main>
    </div>


</body></html>
