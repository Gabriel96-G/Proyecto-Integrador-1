<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="cambiarContrasena">Cambiar contraseña</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/traducciones.js" defer=""></script>
    <script src="../js/idioma.js" defer=""></script>
    <script src="../js/sesion.js" defer=""></script>
    <script src="../js/interfaz.js" defer=""></script>
<link rel="stylesheet" href="../css/idioma.css"></head>
<body>
    <div class="aplicacion">

        <!-- Encabezado -->
        <header class="cabecera">
            <a class="cabecera__marca" href="inicio.html">
                <img class="cabecera__logo" src="../img/logo-cenfotec.png" alt="Universidad CENFOTEC">
            </a>
            <span class="cabecera__nombre" data-i18n="gestionCurricular">Gestión curricular</span>
            <span class="cabecera__usuario">
                <img class="icono-usuario" src="../img/usuario.svg" alt=""> <span data-i18n="administrador">Administrador</span> </span>
        <form id="formulario-idioma" class="selector-idioma">
    <label for="idioma" data-i18n="idioma">Idioma</label>
    <select id="idioma" name="idioma">
        <option value="es" lang="es">Español</option>
        <option value="en" lang="en">English</option>
    </select>
    <button type="submit" data-i18n="aplicarIdioma">Aplicar</button>
    <span class="selector-idioma__estado" id="estado-idioma" role="status" aria-live="polite"></span>
</form></header>

        <!-- Menú principal -->
        <nav class="navegacion" aria-label="Menú principal" data-i18n-aria-label="menuPrincipal">
            <details class="navegacion__desplegable" open="">
                <summary class="navegacion__alternar" data-i18n="menu">Menú</summary>
                <ul class="navegacion__lista">
                    <li class="navegacion__item">
                        <a class="navegacion__enlace" href="inicio.html" aria-current="page">
                            <img class="icono-menu" src="../img/inicio.svg" alt=""> <span data-i18n="inicio">Inicio</span> </a>
                    </li>
                    <li class="navegacion__item">
                        <a class="navegacion__enlace" href="usuarios.html">
                            <img class="icono-menu" src="../img/usuarios.svg" alt=""> <span data-i18n="usuarios">Usuarios</span> </a>
                    </li>
                    <li class="navegacion__item">
                        <a class="navegacion__enlace" href="catalogos.html">
                            <img class="icono-menu" src="../img/catalogos.svg" alt=""> <span data-i18n="catalogos">Catálogos</span> </a>
                    </li>
                    <li class="navegacion__item">
                        <a class="navegacion__enlace" href="cursos.html">
                            <img class="icono-menu" src="../img/cursos.svg" alt=""> <span data-i18n="cursos">Cursos</span> </a>
                    </li>
                </ul>
            </details>
            <a class="navegacion__salir" href="login.html">
                <img class="icono-menu" src="../img/cerrar.svg" alt=""> <span data-i18n="cerrarSesion">Cerrar sesión</span> </a>
        </nav>

        <!-- Cambio de contraseña: vista demostrativa -->
        <main class="contenido">
            <header class="pagina__encabezado">
                <h1 data-i18n="cambiarContrasena">Cambiar contraseña</h1>
                <p class="ruta" data-i18n="inicioSeguridad">Inicio / Seguridad</p>
            </header>

            <p class="aviso aviso--advertencia" id="aviso-demostracion" data-i18n="vistaDemostrativaOperacionNoDisponibleEnEstaIteracion">
                Vista demostrativa. Operación no disponible en esta iteración.
            </p>

            <div class="seguridad">
                <form class="formulario formulario__seccion" aria-describedby="aviso-demostracion">
                    <div class="formulario__rejilla">
                        <div class="formulario__campo formulario__campo--completo">
                            <label class="formulario__etiqueta" for="contrasena-actual" data-i18n="contrasenaActual">Contraseña actual</label>
                            <input class="formulario__control" id="contrasena-actual" name="contrasenaActual" type="password" autocomplete="current-password">
                        </div>

                        <div class="formulario__campo">
                            <label class="formulario__etiqueta" for="nueva-contrasena" data-i18n="nuevaContrasena">Nueva contraseña</label>
                            <input class="formulario__control" id="nueva-contrasena" name="nuevaContrasena" type="password" autocomplete="new-password" minlength="8" maxlength="15">
                        </div>

                        <div class="formulario__campo">
                            <label class="formulario__etiqueta" for="confirmar-contrasena" data-i18n="confirmarContrasena">Confirmar contraseña</label>
                            <input class="formulario__control" id="confirmar-contrasena" name="confirmarContrasena" type="password" autocomplete="new-password" minlength="8" maxlength="15">
                        </div>
                    </div>

                    <div class="formulario__acciones">
                        <button class="boton boton--principal" type="submit" disabled="" data-i18n="guardarCambios">Guardar cambios</button>
                        <a class="boton boton--secundario" href="inicio.html" data-i18n="volverAlPanel">Volver al panel</a>
                    </div>
                </form>

                <aside class="seguridad__ilustracion">
                    <div class="seguridad__circulo">
                        <img class="icono" src="../img/candado.svg" alt="">
                    </div>
                    <h2 data-i18n="gestionDeAcceso">Gestión de acceso</h2>
                </aside>
            </div>
        </main>
    </div>


</body></html>
