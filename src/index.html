<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión curricular</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="cabecera">
        <a class="cabecera__marca" href="index.html">
            <img class="cabecera__logo" src="assets/img/logo-cenfotec.png" alt="Universidad CENFOTEC">
        </a>
        <span class="cabecera__nombre">Gestión curricular</span>
        <span class="cabecera__institucion">Universidad CENFOTEC</span>
    </header>

    <main class="contenedor presentacion">
        <section class="presentacion__contenido">
            <p class="presentacion__etiqueta">Sistema de Gestión Curricular</p>
            <h1 class="presentacion__titulo">
                Cada curso, <span class="presentacion__acento">una ruta clara.</span>
            </h1>
            <p class="presentacion__descripcion">
                Organice la información académica y complete cada registro a su ritmo.
            </p>
            <a class="boton boton--principal" href="pages/login.html">Ingresar al sistema</a>
        </section>

        <section class="presentacion__esquema" aria-label="Funciones del sistema">
            <div class="presentacion__ficha">
                <img class="icono" src="assets/icons/cursos.svg" alt="">
                <div>
                    <h2>Cursos</h2>
                    <p>Registro progresivo</p>
                </div>
            </div>
            <div class="presentacion__ficha presentacion__ficha--catalogos">
                <img class="icono" src="assets/icons/catalogos.svg" alt="">
                <h2>Catálogos conectados</h2>
            </div>
            <div class="presentacion__ficha">
                <img class="icono" src="assets/icons/escuela.svg" alt="">
                <div>
                    <h2>Información organizada</h2>
                    <p>Consultar · Editar · Completar</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
