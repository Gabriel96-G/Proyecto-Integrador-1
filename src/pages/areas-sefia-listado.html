<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Áreas S.E.F.I.A | SGC
  </title>
  <link href="../css/estilos.css" rel="stylesheet"/>
  <script defer="" src="../js/almacenamiento.js">
  </script>
  <script defer="" src="../js/interfaz.js">
  </script>
  <script defer="" src="../js/areas-sefia-listado.js">
  </script>
  <script src="../js/sesion.js" defer></script>
 </head>
 <body class="pagina-aylin">
  <a class="salto-contenido" href="#contenido">
   Saltar al contenido
  </a>
  <div class="aplicacion">
   <header class="cabecera">
    <a class="cabecera__marca" href="inicio.html">
     <img alt="Universidad CENFOTEC" class="cabecera__logo" src="../img/logo-cenfotec.png"/>
    </a>
    <span class="cabecera__nombre">
     Gestión curricular
    </span>
    <span class="cabecera__usuario">
     <img alt="" class="icono-usuario" src="../img/usuario.svg"/>
     Administrador
    </span>
   </header>
   <nav aria-label="Menú principal" class="navegacion">
    <details class="navegacion__desplegable" open="">
     <summary class="navegacion__alternar">
      Menú
     </summary>
     <ul class="navegacion__lista">
      <li class="navegacion__item">
       <a class="navegacion__enlace" href="inicio.html">
        <img alt="" class="icono-menu" src="../img/inicio.svg"/>
        Inicio
       </a>
      </li>
      <li class="navegacion__item">
       <a class="navegacion__enlace" href="usuarios.html">
        <img alt="" class="icono-menu" src="../img/usuarios.svg"/>
        Usuarios
       </a>
      </li>
      <li class="navegacion__item">
       <a aria-current="page" class="navegacion__enlace" href="catalogos.html">
        <img alt="" class="icono-menu" src="../img/catalogos.svg"/>
        Catálogos
       </a>
      </li>
      <li class="navegacion__item">
       <a class="navegacion__enlace" href="cursos.html">
        <img alt="" class="icono-menu" src="../img/cursos.svg"/>
        Cursos
       </a>
      </li>
     </ul>
    </details>
    <a class="navegacion__salir" href="login.html">
     <img alt="" class="icono-menu" src="../img/cerrar.svg"/>
     Cerrar sesión
    </a>
   </nav>
   <main class="contenido" id="contenido">
    <p class="ruta">
     Catálogos / Áreas S.E.F.I.A
    </p>
    <section class="catalogo__cabecera">
     <img alt="" class="icono" src="../img/catalogos.svg"/>
     <div>
      <h1>
       Áreas S.E.F.I.A
      </h1>
      <p>
       Catálogo institucional
      </p>
     </div>
     <a class="boton boton--principal" href="areas-sefia-formulario.html">
      Registrar área S.E.F.I.A
     </a>
    </section>
    <section aria-label="Áreas S.E.F.I.A registradas" class="listado">

     <div class="listado__herramientas">
      <div class="busqueda">
       <label class="busqueda__etiqueta" for="filtro-codigo">Filtrar por código</label>
       <input class="busqueda__control" id="filtro-codigo" placeholder="Código del área" type="search"/>
      </div>
      <div class="busqueda">
       <label class="busqueda__etiqueta" for="buscar">Buscar por nombre</label>
       <input class="busqueda__control" id="buscar" placeholder="Buscar área S.E.F.I.A…" type="search"/>
      </div>
      <div class="busqueda">
       <label class="busqueda__etiqueta" for="filtro-descripcion">Filtrar por descripción</label>
       <input class="busqueda__control" id="filtro-descripcion" placeholder="Descripción del área" type="search"/>
      </div>
      <button class="boton boton--secundario" id="limpiar-filtros" type="button">Limpiar filtros</button>
     </div>
     <p class="formulario__ayuda" id="cantidad" role="status">
     </p>
     <div aria-label="Listado con desplazamiento horizontal" class="tabla-contenedor" role="region" tabindex="0">
      <table class="tabla tabla--catalogo">
       <thead>
        <tr>
         <th scope="col">
          Código
         </th>
         <th scope="col">
          Nombre
         </th>
         <th scope="col">
          Descripción
         </th>
        </tr>
       </thead>
       <tbody id="registros">
       </tbody>
      </table>
      <p class="estado-vacio" hidden="" id="vacio">
      </p>
     </div>
     <a class="enlace-accion" href="catalogos.html">
      ‹ Volver a catálogos
     </a>
    </section>
    <p class="aviso" hidden="" id="aviso">
    </p>
   </main>
  </div>
 </body>
</html>
