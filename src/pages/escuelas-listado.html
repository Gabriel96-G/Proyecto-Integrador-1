<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="listadoDeEscuelas">Listado de escuelas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/plantilla-bootstrap.js" defer></script>
    <script src="../js/traducciones.js" defer=""></script>
    <script src="../js/idioma.js" defer=""></script>
    <script src="../js/almacenamiento.js" defer></script>
    <script src="../js/escuelas-listado.js" defer=""></script>
    <script src="../js/sesion.js" defer=""></script>
</head>

<body class="con-bootstrap">
    <div class="aplicacion">

        <header class="navbar navbar-expand-md cabecera" data-raiz="../"></header>

        <nav class="navbar-expand-md navegacion" aria-label="Menú principal" data-i18n-aria-label="menuPrincipal" data-seccion="catalogos"></nav>

        <main class="contenido">
            <p class="ruta" data-i18n="catalogosEscuelas">Catálogos / Escuelas</p>

            <section class="catalogo__cabecera">
                <img class="icono" src="../img/escuela.svg" alt="">

                <div>
                    <h1 data-i18n="escuelas">Escuelas</h1>
                    <p data-i18n="organizacionInstitucional">Organización institucional</p>
                </div>

                <a class="btn btn-primary boton boton--principal" href="escuelas-formulario.html" data-i18n="registrarEscuela">
                    Registrar escuela
                </a>
            </section>

            <section class="listado" aria-labelledby="titulo-listado">
                <h2 id="titulo-listado" data-i18n="escuelasRegistradas">Escuelas registradas</h2>

                <div class="listado__herramientas">
                    <div class="busqueda">
                        <label class="form-label busqueda__etiqueta" for="buscar-escuela" data-i18n="buscarPorCodigoONombre">
                            Buscar por código o nombre
                        </label>
                        <input class="form-control busqueda__control" id="buscar-escuela" type="search" placeholder="Buscar escuela..." data-i18n-placeholder="buscarEscuela">
                    </div>
                </div>

                <p id="aviso-escuela" class="alert" role="status" hidden></p>
                <dialog id="confirmar-eliminar" class="mensaje-exito" aria-labelledby="pregunta-eliminar" aria-describedby="escuela-elegida">
                    <h2 id="pregunta-eliminar" data-i18n="confirmarEliminarEscuela">¿Eliminar esta escuela?</h2>
                    <p id="escuela-elegida"></p>
                    <form method="dialog" class="d-flex justify-content-center gap-2">
                        <button value="cancelar" class="btn btn-secondary" autofocus data-i18n="cancelar">Cancelar</button>
                        <button value="eliminar" class="btn btn-danger" data-i18n="eliminarEscuelaBoton">Eliminar</button>
                    </form>
                </dialog>

                <div class="table-responsive tabla-contenedor">
                    <table id="tabla-escuelas" class="table tabla tabla--catalogo" hidden="">
                        <thead>
                            <tr>
                                <th scope="col" data-i18n="codigo">Código</th>
                                <th scope="col" data-i18n="nombreEtiqueta">Nombre</th>
                                <th scope="col" data-i18n="director">Director</th>
                                <th scope="col" data-i18n="carreras">Carreras</th>
                                <th scope="col" data-i18n="accion">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-escuelas"></tbody>
                    </table>

                    <p id="mensaje-listado" class="alert estado-vacio" role="status" hidden="" data-i18n="noExistenEscuelasRegistradas">
                        No existen escuelas registradas.
                    </p>
                </div>

            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous" defer></script>
</body></html>
