<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="metodologiasDeAprendizajeSgc">Metodologías de aprendizaje | SGC</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/plantilla-bootstrap.js" defer></script>
    <script src="../js/traducciones.js" defer=""></script>
    <script src="../js/idioma.js" defer=""></script>
    <script src="../js/interfaz.js" defer=""></script>
    <script src="../js/almacenamiento.js" defer></script>
    <script src="../js/catalogos-curso.js" defer></script>
    <script src="../js/catalogos-eliminacion.js" defer></script>
    <script src="../js/metodologias-listado.js" defer=""></script>
    <script src="../js/sesion.js" defer=""></script>
</head>

<body class="con-bootstrap">

    <a class="salto-contenido" href="#contenido" data-i18n="saltarAlContenido">
        Saltar al contenido
    </a>

    <div class="aplicacion">


        <!-- Cabecera institucional Bootstrap -->
        <header class="navbar navbar-expand-md cabecera" data-raiz="../"></header>

        <!-- Menú de navegación Bootstrap -->
        <nav class="navbar-expand-md navegacion" aria-label="Menú principal" data-i18n-aria-label="menuPrincipal"
            data-seccion="catalogos"></nav>


        <!-- Contenido principal -->
        <main class="contenido" id="contenido">

            <p class="ruta" data-i18n="catalogosMetodologiasDeAprendizaje">
                Catálogos / Metodologías de aprendizaje
            </p>

            <!-- Encabezado según wireframe -->
            <section class="catalogo__cabecera">

                <img class="icono" src="../img/catalogos.svg" alt="">

                <div>
                    <h1 data-i18n="metodologiasDeAprendizaje">Metodologías de aprendizaje</h1>
                    <p data-i18n="catalogoInstitucional">Catálogo institucional</p>
                </div>

                <a class="btn btn-primary boton boton--principal" href="metodologias-formulario.html"
                    data-i18n="registrarNuevaMetodologia">
                    Registrar nueva metodología
                </a>

            </section>

            <!-- HU-39: Listado de metodologías -->
            <section class="listado" aria-label="Metodologías de aprendizaje registradas"
                data-i18n-aria-label="metodologiasDeAprendizajeRegistradas">

                <!-- HU-40: Búsqueda sencilla -->
                <div class="listado__herramientas">

                    <div class="busqueda">

                        <label class="form-label busqueda__etiqueta" for="buscar-metodologias" data-i18n="buscarPorCodigoONombre">
                            Buscar por código o nombre
                        </label>

                        <input class="form-control busqueda__control" id="buscar-metodologias" name="busqueda" type="search"
                            placeholder="Buscar metodología..." autocomplete="off"
                            data-i18n-placeholder="buscarMetodologia">

                    </div>

                </div>

                <!-- Tabla de registros -->
                <p id="aviso-eliminacion" class="alert" role="status" hidden></p>
                <dialog id="confirmar-eliminar" class="mensaje-exito" aria-labelledby="pregunta-eliminar" aria-describedby="registro-elegido">
                    <h2 id="pregunta-eliminar" data-i18n="confirmarEliminarMetodologia">¿Eliminar esta metodología?</h2>
                    <p id="registro-elegido"></p>
                    <form method="dialog" class="d-flex justify-content-center gap-2">
                        <button value="cancelar" class="btn btn-secondary" autofocus data-i18n="cancelar">Cancelar</button>
                        <button value="eliminar" class="btn btn-danger" data-i18n="eliminarEscuelaBoton">Eliminar</button>
                    </form>
                </dialog>

                <div class="table-responsive tabla-contenedor">

                    <table id="tabla-metodologias" class="table tabla tabla--catalogo" hidden>

                        <thead>
                            <tr>
                                <th scope="col" data-i18n="codigo">Código</th>
                                <th scope="col" data-i18n="nombreEtiqueta">Nombre</th>
                                <th scope="col" data-i18n="descripcion">Descripción</th>
                                <th scope="col" class="tabla__columna-acciones" data-i18n="accion">Acción</th>
                            </tr>
                        </thead>

                        <tbody id="cuerpo-tabla-metodologias">
                            <!-- Registros cargados mediante JavaScript -->
                        </tbody>

                    </table>

                    <p id="mensaje-listado" class="alert estado-vacio" role="status" hidden>
                    </p>

                </div>

            </section>

        </main>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"
        defer></script>



</body>

</html>
