<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="registrarCasaCertificadoraCenfotec">Registrar casa certificadora - CENFOTEC</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/plantilla-bootstrap.js" defer></script>
    <script src="../js/traducciones.js" defer=""></script>
    <script src="../js/idioma.js" defer=""></script>
    <script src="../js/mensaje-exito.js" defer=""></script>
    <script src="../js/almacenamiento.js" defer></script>
    <script src="../js/catalogos-curso.js" defer></script>
    <script src="../js/casas-certificadoras.js" defer=""></script>

    <style>
        /* Ajustes exclusivos del formulario HU-48 */
        .contenido--casas .ruta {
            margin-top: 8px;
        }

        .contenido--casas .catalogo-formulario {
            margin-top: 16px;
        }

        .contenido--casas .catalogo-resumen__icono {
            width: 44px;
            height: 44px;
            object-fit: contain;
            filter: brightness(0) saturate(100%) invert(24%) sepia(77%) saturate(1575%) hue-rotate(190deg);
        }
    </style>
    <script src="../js/sesion.js" defer=""></script>
</head>

<body class="con-bootstrap">
    <div class="aplicacion">


        <!-- Cabecera institucional Bootstrap -->
        <header class="navbar navbar-expand-md cabecera" data-raiz="../"></header>

        <!-- Menú lateral institucional Bootstrap -->
        <nav class="navbar-expand-md navegacion" aria-label="Menú principal" data-i18n-aria-label="menuPrincipal"
            data-seccion="catalogos"></nav>


        <!-- HU-48: Registro de casas certificadoras -->
        <main class="contenido contenido--casas">

            <p class="ruta" id="ruta-casa-certificadora" data-i18n="catalogosCasasCertificadorasNuevoRegistro">
                Catálogos / Casas certificadoras / Nuevo registro
            </p>

            <h1 id="titulo-casa-certificadora" data-i18n="registrarCasaCertificadora">Registrar casa certificadora</h1>

            <section class="catalogo-formulario">

                <!-- Tarjeta informativa -->
                <div class="catalogo-formulario__ficha">

                    <img class="catalogo-resumen__icono" src="../img/catalogos.svg" alt="">

                    <h2 data-i18n="casaCertificadora">Casa certificadora</h2>

                    <p data-i18n="codigoYNombreDeLaCasaCertificadora">
                        Código y nombre de la casa certificadora.
                    </p>

                </div>

                <!-- Formulario de registro -->
                <form id="formulario-casa-certificadora" class="formulario formulario__seccion" novalidate="">

                    <div class="row gx-4 gy-3">

                        <!-- Código -->
                        <div class="col-12 col-md-4 formulario__campo">

                            <label for="codigo" class="form-label formulario__etiqueta" data-i18n="codigoObligatorio">
                                Código *
                            </label>

                            <input type="text" id="codigo" name="codigo" class="form-control formulario__control"
                                inputmode="numeric" pattern="[0-9]+" required aria-describedby="error-codigo">

                            <p id="error-codigo" class="formulario__mensaje" aria-live="polite"></p>

                        </div>

                        <!-- Nombre -->
                        <div class="col-12 col-md-8 formulario__campo">

                            <label for="nombre" class="form-label formulario__etiqueta" data-i18n="nombre">
                                Nombre *
                            </label>

                            <input type="text" id="nombre" name="nombre" class="form-control formulario__control"
                                required="" aria-describedby="error-nombre">

                            <p id="error-nombre" class="formulario__mensaje" aria-live="polite"></p>

                        </div>

                    </div>

                    <p class="formulario__nota" data-i18n="campoObligatorio">
                        * Campo obligatorio
                    </p>

                    <!-- Retroalimentación del registro -->

                    <p id="mensaje-registro" class="alert aviso" role="status" aria-live="polite" hidden></p>


                    <!-- Acciones -->
                    <div class="formulario__acciones">

                        <button type="submit" id="boton-guardar-casa" class="btn btn-primary boton boton--principal"
                            data-i18n="guardarRegistro">
                            Guardar registro
                        </button>

                        <a href="casas-certificadoras-listado.html"
                            class="btn btn-outline-secondary boton boton--secundario" data-i18n="cancelar">
                            Cancelar
                        </a>

                    </div>

                </form>

            </section>

            <!-- Opción para volver al listado de casas certificadoras -->
            <a href="casas-certificadoras-listado.html" class="enlace-volver-catalogos" style="display: inline-flex;
                       align-items: center;
                       gap: 6px;
                       margin-top: 14px;
                       color: #0056b3;
                       font-weight: 600;
                       text-decoration: none;">

                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="m15 18-6-6 6-6"></path>
                </svg> <span data-i18n="volverACasasCertificadoras">Volver a casas certificadoras</span> </a>

        </main>



    </div>

    <!-- Bootstrap 5.3.9 JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"
        defer></script>

</body>

</html>
