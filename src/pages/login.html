<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="iniciarSesion">Iniciar sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/plantilla-bootstrap.js" defer></script>
    <script src="../js/traducciones.js" defer=""></script>
    <script src="../js/idioma.js" defer=""></script>
    <script src="../js/almacenamiento.js" defer=""></script>
    <script src="../js/sesion.js" defer></script>
    <script src="../js/login.js" defer=""></script>
</head>
<body class="con-bootstrap">
    <header class="navbar navbar-expand-md cabecera" data-raiz="../"></header>

    <main class="contenedor">
        <div class="acceso">
            <section class="acceso__identidad">
                <div>
                    <h1 data-i18n="bienvenidoDeNuevo">Bienvenido de nuevo</h1>
                    <p data-i18n="unMismoEspacioParaLaGestionDeUsuariosCatalogos">Un mismo espacio para la gestión de usuarios, catálogos y cursos.</p>
                </div>
                <div class="acceso__beneficios">
                    <div class="acceso__beneficio">
                        <img class="icono" src="../img/catalogos.svg" alt="">
                        <span data-i18n="organizar">Organizar</span>
                    </div>
                    <div class="acceso__beneficio">
                        <img class="icono" src="../img/cursos.svg" alt="">
                        <span data-i18n="consultar">Consultar</span>
                    </div>
                    <div class="acceso__beneficio">
                        <img class="icono" src="../img/escuela.svg" alt="">
                        <span data-i18n="completar">Completar</span>
                    </div>
                </div>
            </section>

            <section class="acceso__contenido" aria-labelledby="titulo-login">
                <div>
                    <h2 id="titulo-login" data-i18n="iniciarSesion">Iniciar sesión</h2>
                    <p class="acceso__subtitulo" data-i18n="accesoInterno">Acceso de usuarios internos</p>
                </div>

                <form id="formulario-login" class="formulario" novalidate="">
                    <div class="formulario__campo">
                        <label class="form-label formulario__etiqueta" for="correo" data-i18n="correoInstitucional">Correo institucional *</label>
                        <input class="form-control formulario__control" id="correo" name="correo" type="email" autocomplete="username" aria-describedby="correo-mensaje" required="">
                        <p id="correo-mensaje" class="invalid-feedback formulario__mensaje" aria-live="polite"></p>
                    </div>

                    <div class="formulario__campo">
                        <label class="form-label formulario__etiqueta" for="contrasena" data-i18n="contrasena">Contraseña *</label>
                        <input class="form-control formulario__control" id="contrasena" name="contrasena" type="password" autocomplete="current-password" aria-describedby="contrasena-mensaje" required="">
                        <p id="contrasena-mensaje" class="invalid-feedback formulario__mensaje" aria-live="polite"></p>
                    </div>

                    <p id="mensaje-login" class="alert alert-danger aviso aviso--error" role="alert" hidden=""></p>
                    <button class="btn btn-primary boton boton--principal boton--completo" type="submit" data-i18n="ingresar">Ingresar</button>
                </form>

                <a class="acceso__enlaces" href="recuperar-contrasena.html" data-i18n="olvidoSuContrasena">
                ¿Olvidó su contraseña?
            </a>
            </section>
        </div>
    </main>


</body></html>
