<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de estados del curso</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/estados-curso-listado.js" defer></script>
    <script src="../js/sesion.js" defer></script>
</head>

<body>
    <div class="aplicacion">

        <header class="cabecera">
            <a class="cabecera__marca" href="inicio.html">
                <img class="cabecera__logo" src="../img/logo-cenfotec.png" alt="Universidad CENFOTEC">
            </a>

            <span class="cabecera__nombre">Gestión curricular</span>

            <span class="cabecera__usuario">
                <img class="icono-usuario" src="../img/usuario.svg" alt="">
                Administrador
            </span>
        </header>

        <nav class="navegacion" aria-label="Menú principal">
            <ul class="navegacion__lista">
                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="inicio.html">
                        <img class="icono-menu" src="../img/inicio.svg" alt="">
                        Inicio
                    </a>
                </li>

                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="usuarios.html">
                        <img class="icono-menu" src="../img/usuarios.svg" alt="">
                        Usuarios
                    </a>
                </li>

                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="catalogos.html" aria-current="page">
                        <img class="icono-menu" src="../img/catalogos.svg" alt="">
                        Catálogos
                    </a>
                </li>

                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="cursos.html">
                        <img class="icono-menu" src="../img/cursos.svg" alt="">
                        Cursos
                    </a>
                </li>
            </ul>

            <a class="navegacion__salir" href="login.html">
                <img class="icono-menu" src="../img/cerrar.svg" alt="">
                Cerrar sesión
            </a>
        </nav>

        <main class="contenido">
            <p class="ruta">Catálogos / Estados del curso</p>

            <section class="catalogo__cabecera">
                <img class="icono" src="../img/catalogos.svg" alt="">

                <div>
                    <h1>Estados del curso</h1>
                    <p>Valores disponibles para los cursos</p>
                </div>

                <a class="boton boton--principal" href="estados-curso-formulario.html">
                    Registrar estado
                </a>
            </section>

            <section class="listado" aria-labelledby="titulo-listado">
                <h2 id="titulo-listado">Estados registrados</h2>

                <div class="tabla-contenedor">
                    <table id="tabla-estados" class="tabla tabla--catalogo" hidden>
                        <thead>
                            <tr>
                                <th scope="col">Código</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Descripción</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-estados"></tbody>
                    </table>

                    <p id="mensaje-listado" class="estado-vacio" role="status" hidden>
                        No existen estados del curso registrados.
                    </p>
                </div>

            </section>
        </main>
    </div>
</body>
</html>
