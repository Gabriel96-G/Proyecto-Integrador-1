<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title data-i18n="areasSEFIASgc">
   Áreas S.E.F.I.A | SGC
  </title>
  <link href="../css/estilos.css" rel="stylesheet">
  <script src="../js/traducciones.js" defer=""></script>
    <script src="../js/idioma.js" defer=""></script>
    <script defer="" src="../js/almacenamiento.js">
  </script>
  <script defer="" src="../js/interfaz.js">
  </script>
  <script defer="" src="../js/areas-sefia-listado.js">
  </script>
  <script src="../js/sesion.js" defer=""></script>
 <link rel="stylesheet" href="../css/idioma.css"></head>
 <body class="pagina-sgc">
  <a class="salto-contenido" href="#contenido" data-i18n="saltarAlContenido">
   Saltar al contenido
  </a>
  <div class="aplicacion">
   <header class="cabecera">
    <a class="cabecera__marca" href="inicio.html">
     <img alt="Universidad CENFOTEC" class="cabecera__logo" src="../img/logo-cenfotec.png">
    </a>
    <span class="cabecera__nombre" data-i18n="gestionCurricular">
     Gestión curricular
    </span>
    <span class="cabecera__usuario">
     <img alt="" class="icono-usuario" src="../img/usuario.svg"> <span data-i18n="administrador">Administrador</span> </span>
   <form id="formulario-idioma" class="selector-idioma">
    <label for="idioma" data-i18n="idioma">Idioma</label>
    <select id="idioma" name="idioma">
        <option value="es" lang="es">Español</option>
        <option value="en" lang="en">English</option>
    </select>
    <button type="submit" data-i18n="aplicarIdioma">Aplicar</button>
    <span class="selector-idioma__estado" id="estado-idioma" role="status" aria-live="polite"></span>
</form></header>
   <nav aria-label="Menú principal" class="navegacion" data-i18n-aria-label="menuPrincipal">
    <details class="navegacion__desplegable" open="">
     <summary class="navegacion__alternar" data-i18n="menu">
      Menú
     </summary>
     <ul class="navegacion__lista">
      <li class="navegacion__item">
       <a class="navegacion__enlace" href="inicio.html">
        <img alt="" class="icono-menu" src="../img/inicio.svg"> <span data-i18n="inicio">Inicio</span> </a>
      </li>
      <li class="navegacion__item">
       <a class="navegacion__enlace" href="usuarios.html">
        <img alt="" class="icono-menu" src="../img/usuarios.svg"> <span data-i18n="usuarios">Usuarios</span> </a>
      </li>
      <li class="navegacion__item">
       <a aria-current="page" class="navegacion__enlace" href="catalogos.html">
        <img alt="" class="icono-menu" src="../img/catalogos.svg"> <span data-i18n="catalogos">Catálogos</span> </a>
      </li>
      <li class="navegacion__item">
       <a class="navegacion__enlace" href="cursos.html">
        <img alt="" class="icono-menu" src="../img/cursos.svg"> <span data-i18n="cursos">Cursos</span> </a>
      </li>
     </ul>
    </details>
    <a class="navegacion__salir" href="login.html">
     <img alt="" class="icono-menu" src="../img/cerrar.svg"> <span data-i18n="cerrarSesion">Cerrar sesión</span> </a>
   </nav>
   <main class="contenido" id="contenido">
    <p class="ruta" data-i18n="catalogosAreasSEFIA">
     Catálogos / Áreas S.E.F.I.A
    </p>
    <section class="catalogo__cabecera">
     <img alt="" class="icono" src="../img/catalogos.svg">
     <div>
      <h1 data-i18n="areasSEFIA">
       Áreas S.E.F.I.A
      </h1>
      <p data-i18n="catalogoInstitucional">
       Catálogo institucional
      </p>
     </div>
     <a class="boton boton--principal" href="areas-sefia-formulario.html" data-i18n="registrarAreaSEFIA">
      Registrar área S.E.F.I.A
     </a>
    </section>
    <section aria-label="Áreas S.E.F.I.A registradas" class="listado" data-i18n-aria-label="areasSEFIARegistradas">

     <div class="listado__herramientas">
      <div class="busqueda">
       <label class="busqueda__etiqueta" for="filtro-codigo" data-i18n="filtrarPorCodigo">Filtrar por código</label>
       <input class="busqueda__control" id="filtro-codigo" placeholder="Código del área" type="search" data-i18n-placeholder="codigoDelArea">
      </div>
      <div class="busqueda">
       <label class="busqueda__etiqueta" for="buscar" data-i18n="buscarPorNombre">Buscar por nombre</label>
       <input class="busqueda__control" id="buscar" placeholder="Buscar área S.E.F.I.A…" type="search" data-i18n-placeholder="buscarAreaSEFIA">
      </div>
      <div class="busqueda">
       <label class="busqueda__etiqueta" for="filtro-descripcion" data-i18n="filtrarPorDescripcion">Filtrar por descripción</label>
       <input class="busqueda__control" id="filtro-descripcion" placeholder="Descripción del área" type="search" data-i18n-placeholder="descripcionDelArea">
      </div>
      <button class="boton boton--secundario" id="limpiar-filtros" type="button" data-i18n="limpiarFiltros">Limpiar filtros</button>
     </div>
     <p class="formulario__ayuda" id="cantidad" role="status">
     </p>
     <div aria-label="Listado con desplazamiento horizontal" class="tabla-contenedor" role="region" tabindex="0" data-i18n-aria-label="listadoConDesplazamientoHorizontal">
      <table class="tabla tabla--catalogo">
       <thead>
        <tr>
         <th scope="col" data-i18n="codigo">
          Código
         </th>
         <th scope="col" data-i18n="nombreEtiqueta">
          Nombre
         </th>
         <th scope="col" data-i18n="descripcion">
          Descripción
         </th>
         <th scope="col" data-i18n="acciones">
          Acciones
         </th>
        </tr>
       </thead>
       <tbody id="registros">
       </tbody>
      </table>
      <p class="estado-vacio" hidden="" id="vacio">
      </p>
     </div>
    </section>
    <p class="aviso" hidden="" id="aviso">
    </p>
   </main>
  </div>


</body></html>
