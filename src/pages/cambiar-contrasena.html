<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="cambiarContrasena">Cambiar contraseña</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/plantilla-bootstrap.js" defer></script>
    <script src="../js/traducciones.js" defer=""></script>
    <script src="../js/idioma.js" defer=""></script>
    <script src="../js/sesion.js" defer=""></script>
    <script src="../js/interfaz.js" defer=""></script>
</head>
<body class="con-bootstrap">
    <div class="aplicacion">

        <!-- Encabezado -->
        <header class="navbar navbar-expand-md cabecera" data-raiz="../"></header>

        <!-- Menú principal -->
        <nav class="navbar-expand-md navegacion" aria-label="Menú principal" data-i18n-aria-label="menuPrincipal" data-seccion="inicio"></nav>

        <!-- Cambio de contraseña: vista demostrativa -->
        <main class="contenido">
            <header class="pagina__encabezado">
                <h1 data-i18n="cambiarContrasena">Cambiar contraseña</h1>
                <p class="ruta" data-i18n="inicioSeguridad">Inicio / Seguridad</p>
            </header>

            <p class="alert alert-warning aviso aviso--advertencia" id="aviso-demostracion" data-i18n="vistaDemostrativaOperacionNoDisponibleEnEstaIteracion">
                Vista demostrativa. Operación no disponible en esta iteración.
            </p>

            <div class="seguridad">
                <form class="container-fluid formulario formulario__seccion" aria-describedby="aviso-demostracion">
                    <div class="row gx-4 gy-3">
                        <div class="col-12 formulario__campo">
                            <label class="form-label formulario__etiqueta" for="contrasena-actual" data-i18n="contrasenaActual">Contraseña actual</label>
                            <input class="form-control formulario__control" id="contrasena-actual" name="contrasenaActual" type="password" autocomplete="current-password">
                        </div>

                        <div class="col-12 col-md-6 formulario__campo">
                            <label class="form-label formulario__etiqueta" for="nueva-contrasena" data-i18n="nuevaContrasena">Nueva contraseña</label>
                            <input class="form-control formulario__control" id="nueva-contrasena" name="nuevaContrasena" type="password" autocomplete="new-password" minlength="8" maxlength="15">
                        </div>

                        <div class="col-12 col-md-6 formulario__campo">
                            <label class="form-label formulario__etiqueta" for="confirmar-contrasena" data-i18n="confirmarContrasena">Confirmar contraseña</label>
                            <input class="form-control formulario__control" id="confirmar-contrasena" name="confirmarContrasena" type="password" autocomplete="new-password" minlength="8" maxlength="15">
                        </div>
                    </div>

                    <div class="formulario__acciones">
                        <button class="btn btn-primary boton boton--principal" type="submit" disabled="" data-i18n="guardarCambios">Guardar cambios</button>
                        <a class="btn btn-outline-secondary boton boton--secundario" href="inicio.html" data-i18n="volverAlPanel">Volver al panel</a>
                    </div>
                </form>

                <aside class="seguridad__ilustracion">
                    <div class="seguridad__circulo">
                        <img class="icono" src="../img/candado.svg" alt="">
                    </div>
                    <h2 data-i18n="gestionDeAcceso">Gestión de acceso</h2>
                </aside>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous" defer></script>
</body></html>
