<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="registrarEscuela">Registrar escuela</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/plantilla-bootstrap.js" defer></script>
    <script src="../js/traducciones.js" defer=""></script>
    <script src="../js/idioma.js" defer=""></script>
    <script src="../js/almacenamiento.js" defer=""></script>
    <script src="../js/mensaje-exito.js" defer=""></script>
    <script src="../js/escuelas.js" defer=""></script>
    <script src="../js/sesion.js" defer=""></script>
</head>

<body class="con-bootstrap">
    <div class="aplicacion">

        <header class="navbar navbar-expand-md cabecera" data-raiz="../"></header>

        <nav class="navbar-expand-md navegacion" aria-label="Menú principal" data-i18n-aria-label="menuPrincipal" data-seccion="catalogos"></nav>

        <main class="contenido">
            <p id="ruta-escuela" class="ruta" data-i18n="catalogosEscuelasNuevoRegistro">Catálogos / Escuelas / Nuevo registro</p>
            <h1 id="titulo-escuela" data-i18n="registrarEscuela">Registrar escuela</h1>

            <section class="catalogo-formulario">

                <div class="catalogo-formulario__ficha">
                    <img class="catalogo-resumen__icono" src="../img/escuela.svg" alt="">
                    <h2 data-i18n="escuelaEtiqueta">Escuela</h2>
                    <p data-i18n="codigoNombreYDirectorAsociado">Código, nombre y director asociado.</p>
                </div>

                <form id="formulario-escuela" class="container-fluid formulario formulario__seccion" novalidate="">
                    <div class="row gx-4 gy-3">

                        <div class="col-12 col-md-4 formulario__campo">
                            <label class="form-label formulario__etiqueta" for="codigo"> <span data-i18n="codigo">Código</span> <span class="formulario__obligatorio">*</span>
                            </label>
                            <input class="form-control formulario__control" id="codigo" name="codigo" type="text" aria-describedby="codigo-ayuda codigo-mensaje" required="">
                            <p id="codigo-ayuda" class="formulario__ayuda" data-i18n="elCodigoDebeSerUnico">El código debe ser único.</p>
                            <p id="codigo-mensaje" class="invalid-feedback formulario__mensaje"></p>
                        </div>

                        <div class="col-12 col-md-8 formulario__campo">
                            <label class="form-label formulario__etiqueta" for="nombre"> <span data-i18n="nombreEtiqueta">Nombre</span> <span class="formulario__obligatorio">*</span>
                            </label>
                            <input class="form-control formulario__control" id="nombre" name="nombre" type="text" aria-describedby="nombre-mensaje" required="">
                            <p id="nombre-mensaje" class="invalid-feedback formulario__mensaje"></p>
                        </div>

                        <div class="col-12 formulario__campo">
                            <label class="form-label formulario__etiqueta" for="director-asociado"> <span data-i18n="directorAsociado">Director asociado</span> <span class="formulario__obligatorio">*</span>
                            </label>
                            <select class="form-select formulario__control" id="director-asociado" name="directorAsociado" aria-describedby="director-mensaje" required="">
                                <option value="" data-i18n="seleccionarDirector">Seleccionar director</option>
                            </select>
                            <p id="director-mensaje" class="invalid-feedback formulario__mensaje"></p>
                        </div>

                    </div>

                    <p class="formulario__nota" data-i18n="campoObligatorio">* Campo obligatorio</p>
                    <div id="mensaje-resultado" class="alert aviso" role="status" hidden=""></div>

                    <div class="formulario__acciones">
                        <button id="guardar-escuela" class="btn btn-primary boton boton--principal" type="submit" data-i18n="guardarRegistro">Guardar registro</button>
                        <a class="btn btn-outline-secondary boton boton--secundario" href="escuelas-listado.html" data-i18n="cancelar">Cancelar</a>
                    </div>
                </form>

            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous" defer></script>
</body></html>
