
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Listado de casas certificadoras - CENFOTEC</title>

    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/casas-certificadoras-listado.js" defer></script>

    <style>
        /* Estilos exclusivos del listado HU-49 */

        .casas-listado__encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 18px 20px;
            background-color: #e8f0fd;
            border-radius: 12px;
        }

        .casas-listado__identidad {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .casas-listado__icono {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .casas-listado__encabezado h1 {
            margin: 0;
            color: #123c79;
            font-size: 1.65rem;
        }

        .casas-listado__subtitulo {
            margin: 4px 0 0;
            color: #526279;
            font-size: 0.9rem;
        }

        .casas-listado__busqueda {
            margin-top: 20px;
        }

        .casas-listado__busqueda label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .casas-listado__busqueda input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #9baac0;
            border-radius: 6px;
            font: inherit;
            background-color: #fff;
        }

        .casas-listado__busqueda input:focus {
            outline: 2px solid #0056b3;
            outline-offset: 2px;
        }

        .casas-listado__tabla-contenedor {
            margin-top: 18px;
            padding: 16px;
            background-color: white;
            border-radius: 12px;
            overflow-x: auto;
        }

        .casas-listado__tabla-contenedor .tabla {
            width: 100%;
        }

        .casas-listado__tabla-contenedor .tabla[hidden] {
            display: none !important;
        }

        .casas-listado__volver {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            color: #0056b3;
            font-weight: 600;
            text-decoration: none;
        }

        .casas-listado__volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            .casas-listado__encabezado {
                align-items: stretch;
                flex-direction: column;
            }

            .casas-listado__encabezado .boton {
                text-align: center;
            }
        }
    </style>

</head>

<body>
    <div class="aplicacion">

        <!-- Cabecera: conservar logo original de CENFOTEC -->
        <header class="cabecera">

            <a class="cabecera__marca" href="inicio.html">
                <img
                    class="cabecera__logo"
                    src="../assets/img/logo-cenfotec.png"
                    alt="Universidad CENFOTEC">
            </a>

            <span class="cabecera__nombre">
                Gestión curricular
            </span>

            <span class="cabecera__usuario">
                <img
                    class="icono-usuario"
                    src="../assets/icons/usuario.svg"
                    alt="">
                Administrador
            </span>

        </header>

        <!-- Menú lateral institucional -->
        <nav class="navegacion" aria-label="Menú principal">

            <ul class="navegacion__lista">

                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="inicio.html">
                        <img
                            class="icono-menu"
                            src="../assets/icons/inicio.svg"
                            alt="">
                        Inicio
                    </a>
                </li>

                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="usuarios.html">
                        <img
                            class="icono-menu"
                            src="../assets/icons/usuarios.svg"
                            alt="">
                        Usuarios
                    </a>
                </li>

                <li class="navegacion__item">
                    <a
                        class="navegacion__enlace"
                        href="catalogos.html"
                        aria-current="page">
                        <img
                            class="icono-menu"
                            src="../assets/icons/catalogos.svg"
                            alt="">
                        Catálogos
                    </a>
                </li>

                <li class="navegacion__item">
                    <a class="navegacion__enlace" href="cursos.html">
                        <img
                            class="icono-menu"
                            src="../assets/icons/cursos.svg"
                            alt="">
                        Cursos
                    </a>
                </li>

            </ul>

            <a class="navegacion__salir" href="../index.html">
                <img
                    class="icono-menu"
                    src="../assets/icons/cerrar.svg"
                    alt="">
                Cerrar sesión
            </a>

        </nav>

        <!-- HU-49: Listado de casas certificadoras -->
        <main class="contenido casas-listado">

            <p class="ruta">
                Catálogos / Casas certificadoras
            </p>

            <!-- Encabezado azul claro -->
            <section class="casas-listado__encabezado">

                <div class="casas-listado__identidad">

                    <img
                        class="casas-listado__icono"
                        src="../assets/icons/catalogos.svg"
                        alt="">

                    <div>
                        <h1>Casas certificadoras</h1>

                        <p class="casas-listado__subtitulo">
                            Organizaciones certificadoras
                        </p>
                    </div>

                </div>

                <!-- Botón ubicado a la derecha -->
                <a
                    href="casas-certificadoras-formulario.html"
                    class="boton boton--principal">
                    Registrar casa certificadora
                </a>

            </section>

            <!-- Búsqueda por nombre -->
            <section class="casas-listado__busqueda">

                <label for="buscar-casas-certificadoras">
                    Buscar por nombre
                </label>

                <input
                    type="search"
                    id="buscar-casas-certificadoras"
                    name="buscar-casas-certificadoras"
                    placeholder="Buscar casa certificadora..."
                    aria-controls="tabla-casas-certificadoras"
                    autocomplete="off">

            </section>

            <!-- Listado -->
            <section
                class="casas-listado__tabla-contenedor"
                aria-label="Casas certificadoras registradas">

                <!-- Mensajes informativos -->
                <p
                    id="mensaje-listado"
                    class="formulario__mensaje"
                    role="status"
                    aria-live="polite"
                    hidden></p>

                <!-- Tabla -->
                <table
                    id="tabla-casas-certificadoras"
                    class="tabla"
                    hidden>

                    <thead>
                        <tr>
                            <th scope="col">Código</th>
                            <th scope="col">Nombre</th>
                        </tr>
                    </thead>

                    <tbody id="cuerpo-tabla-casas">
                        <!-- Registros generados desde JavaScript -->
                    </tbody>

                </table>

            </section>

            <!-- Regresar al catálogo principal -->
            <a
                href="catalogos.html"
                class="casas-listado__volver">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="m15 18-6-6 6-6"/>
                </svg>

                Volver a catálogos

            </a>

        </main>

    </div>
</body>

</html>
